<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="title desc">
<title id="title">Dakota Hollaway, SOC analyst</title>
<desc id="desc">Dakota Hollaway. SOC analyst. I attack my own lab, then build the detections that catch me. Open to Tier 1 SOC roles, remote or in Texas. An intrusion I ran on my own domain, caught in Splunk and Sentinel: recon (T1087), Kerberoasting (T1558.003) and lateral movement (T1021.002) each fired an alert, then the alerts were correlated into one actor and one timeline.</desc>
<style>@font-face{font-family:'B612';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'B612';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'B612',sans-serif;fill:#E4ECF5}
.name{font-weight:700;font-size:74px;letter-spacing:-1.5px}
.tag{font-size:23px;fill:#E4ECF5}
.status{font-size:18px;fill:#93A6BC}
.cap{font-size:18px;fill:#93A6BC}
.stage{font-weight:700;font-size:21px}
.id{font-size:18px;letter-spacing:.3px;fill:#E4ECF5}
.note{font-size:18px;fill:#93A6BC}
.fired{font-size:16px;fill:#FF7466}
.node,.ring{transform-box:fill-box;transform-origin:center}
.ring{opacity:0}
@media (prefers-reduced-motion:no-preference){
.n0,.n1,.n2{animation:fire .35s ease-out both}
.r0,.r1,.r2{animation:pulse 1.4s ease-out both}
.n0,.r0{animation-delay:.5s}.n1,.r1{animation-delay:1.1s}.n2,.r2{animation-delay:1.7s}
.link{animation:draw .6s ease-in-out 2.4s both}
.n3{animation:pop .3s ease-out 3s both}
.l0,.l1,.l2,.l3{animation:show .3s ease-out both}
.l0{animation-delay:.5s}.l1{animation-delay:1.1s}.l2{animation-delay:1.7s}.l3{animation-delay:3s}
}
@keyframes fire{from{fill:var(--bg)}to{}}
@keyframes pulse{0%{opacity:0;transform:scale(1)}2%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}</style>
<rect x="0.5" y="0.5" width="999" height="419" rx="18" fill="#0E1A28" stroke="#22344A"/>
<text x="53" y="112" class="name">Dakota Hollaway</text>
<text x="56" y="160" class="tag">SOC analyst. I attack my own lab, then build the detections that catch me.</text>
<circle cx="62" cy="192.1" r="5.5" fill="#4CC38A"/>
<text x="76" y="198" class="status">Open to Tier 1 SOC roles, remote or in Texas</text>
<text x="56" y="262" class="cap">An intrusion I ran on my own domain, caught in Splunk and Sentinel</text>
<line x1="62.5" y1="294" x2="535.5" y2="294" stroke="#33475E" stroke-width="2"/>
<line class="link" x1="535.5" y1="294" x2="846.0" y2="294" stroke="#E4ECF5" stroke-width="2" stroke-dasharray="310.6" style="--len:310.6"/>
<circle class="ring r0" cx="62.5" cy="294" r="6.5" fill="none" stroke="#FF7466" stroke-width="2"/>
<circle class="node n0" cx="62.5" cy="294" r="6.5" fill="#FF7466" stroke="#FF7466" stroke-width="2" style="--bg:#0E1A28"/>
<text x="56.0" y="338" class="stage">Recon</text>
<text x="56.0" y="364" class="id">T1087</text>
<text x="56.0" y="389" class="fired l0">Alert fired</text>
<circle class="ring r1" cx="269.6" cy="294" r="6.5" fill="none" stroke="#FF7466" stroke-width="2"/>
<circle class="node n1" cx="269.6" cy="294" r="6.5" fill="#FF7466" stroke="#FF7466" stroke-width="2" style="--bg:#0E1A28"/>
<text x="263.1" y="338" class="stage">Kerberoasting</text>
<text x="263.1" y="364" class="id">T1558.003</text>
<text x="263.1" y="389" class="fired l1">Alert fired</text>
<circle class="ring r2" cx="535.5" cy="294" r="6.5" fill="none" stroke="#FF7466" stroke-width="2"/>
<circle class="node n2" cx="535.5" cy="294" r="6.5" fill="#FF7466" stroke="#FF7466" stroke-width="2" style="--bg:#0E1A28"/>
<text x="529.0" y="338" class="stage">Lateral movement</text>
<text x="529.0" y="364" class="id">T1021.002</text>
<text x="529.0" y="389" class="fired l2">Alert fired</text>
<circle class="node n3" cx="846.0" cy="294" r="6.5" fill="#0E1A28" stroke="#E4ECF5" stroke-width="2.5"/>
<text x="839.5" y="338" class="stage">Correlated</text>
<text x="839.5" y="364" class="note l3">One actor,</text>
<text x="839.5" y="389" class="note l3">one timeline</text>
</svg>
